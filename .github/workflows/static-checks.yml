---
name: Static Checks Pipeline
on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  linter:
    name: Lint Codebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Mega Linter
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_GHERKIN: false
          VALIDATE_JSCPD: false
          SPELL_MISSPELL_DISABLE_ERRORS: true
          SPELL_CSPELL_DISABLE_ERRORS: true
          COPYPASTE_JSCPD_DISABLE_ERRORS: true
          LINTER_RULES_PATH: "."
          GROOVY_NPM_GROOVY_LINT_FILTER_REGEX_EXCLUDE: "Jenkinsfile"
          MARKDOWN_MARKDOWN_LINK_CHECK_DISABLE_ERRORS: true
          PYTHON_MYPY_DISABLE_ERRORS: true
          DISABLE_LINTERS: "SPELL_CSPELL,REPOSITORY_KICS,PYTHON_PYRIGHT,REPOSITORY_DEVSKIM,REPOSITORY_GRYPE,ACTION_ZIZMOR"

  commit-messages:
    name: Conventional Commits Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .github/config/commitlint.config.mjs
          failOnWarnings: false
